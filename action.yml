name: 'Action Security Linter'
description: 'Scans action.yml for security best practices and common pitfalls.'
author: 'ollieb89'
inputs:
  path:
    description: 'Path to action.yml'
    required: false
    default: 'action.yml'
  fail-on-error:
    description: 'Whether to fail the workflow if security errors are found'
    required: false
    default: 'true'
outputs:
  results:
    description: 'JSON string of linter results'
runs:
  using: 'node20'
  main: 'dist/index.js'
branding:
  icon: 'shield'
  color: 'blue'
